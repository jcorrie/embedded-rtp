# Publish to crates.io and make a GitHub release when a new version reaches
# main: merging a pull request that bumps `version` in Cargo.toml releases
# it. On any other push to main this finds the version already tagged and
# stops.
#
# The whole of CI runs first. crates.io trusts this workflow directly
# (Trusted Publishing), so no API token is stored: the crate's settings
# name this repository, this file and the `release` environment.
name: release

on:
  push:
    branches: [main]
  # To retry a release that failed part way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Is this version released?
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "embedded-rtp") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged: nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $version."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    # Can require an approval: repository settings, Environments.
    environment: release
    permissions:
      contents: write # the tag and GitHub release
      id-token: write # Trusted Publishing
    env:
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # A rerun after the GitHub release step failed finds the version
      # already on crates.io and goes straight on to the release.
      - name: Publish to crates.io
        run: |
          if curl -sf -A "embedded-rtp release workflow" \
              "https://crates.io/api/v1/crates/embedded-rtp/${TAG#v}" > /dev/null; then
            echo "${TAG#v} is already on crates.io."
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # Tags this commit, with notes from the pull requests merged since the
      # last release. A version with a pre-release part (0.2.0-rc.1) is
      # marked as a pre-release.
      - name: GitHub release
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes \
            --title "$TAG" $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
