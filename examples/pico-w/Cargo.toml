[package]
name = "pico-w-intercom"
version = "0.1.0"
edition = "2021"
publish = false
description = "A Raspberry Pi Pico W intercom client for embedded-rtp, plus on-device benchmarks"
license = "MIT OR Apache-2.0"

[features]
default = ["srtp"]
# Benchmark SRTP in `bench`. The intercom itself speaks plain RTP.
srtp = ["embedded-rtp/srtp"]
# Route memcpy, division and friends to the RP2040's ROM routines. Compare
# `bench` with and without it.
rom-intrinsics = ["embassy-rp/intrinsics", "embassy-rp/rom-v2-intrinsics"]
# No microphone: receive and play only, with RTCP as the keep-alive.
listen-only = []
# Send the microphone all the time (full duplex) instead of push-to-talk.
# Without echo handling (embedded-rtp #9) a speaker near the microphone
# feeds back.
always-on = []
# Report CPU load every 5 s, by counting idle-loop iterations. Keeps the CPU
# from sleeping, so only for measuring.
cpu-load = []

[dependencies]
embedded-rtp = { path = "../.." }
embassy-rp = { version = "0.10", features = ["rp2040", "defmt", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-net = { version = "0.9", features = ["defmt", "udp", "dhcpv4", "proto-ipv4"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
cyw43 = { version = "0.7", features = ["defmt"] }
cyw43-pio = { version = "0.10", features = ["defmt"] }
cyw43-firmware = { version = "0.1", features = ["wifi"] }
aligned = "0.4"
pio = "0.3"
static_cell = "2"
# The M0+ has no compare-and-swap; static_cell uses this instead.
portable-atomic = { version = "1", features = ["critical-section"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = "s"
