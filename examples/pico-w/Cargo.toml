[package]
name = "intercom-pico-w"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "An intercom device for the Raspberry Pi Pico W, built on embedded-rtp"
publish = false

[[bin]]
name = "intercom"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "cycles"
path = "src/cycles.rs"
test = false
bench = false

[features]
# No microphone: only listen.
listen-only = []

[dependencies]
embedded-rtp = { path = "../..", features = ["srtp"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040", "intrinsics", "rom-func-cache"] }
embassy-net = { version = "0.9", features = ["defmt", "udp", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = "0.1"
cyw43 = { version = "0.7", features = ["defmt"] }
cyw43-pio = { version = "0.10", features = ["defmt"] }
cyw43-firmware = { version = "0.1", features = ["wifi"] }
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

[profile.release]
debug = 2
lto = true
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = "s"
